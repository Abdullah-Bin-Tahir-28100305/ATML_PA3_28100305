# Task 2 - SigLIP -> MLP connector -> Qwen3-0.6B VLM.
seed: 6304
llm_id: Qwen/Qwen3-0.6B
vision_id: google/siglip-base-patch16-224
num_visual_tokens: 196          # set 49 for the optional 2x2-pooled compression run
run_name: main196               # use e.g. pool49 for the optional run (separate output folder)

data:
  root: data/task2              # relative to $PA3_OUT
  coco_annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  coco_image_url: http://images.cocodataset.org/{split}2014/{file_name}
  vqa_urls:
    q_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Questions_Train_mscoco.zip
    q_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Questions_Val_mscoco.zip
    a_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Annotations_Train_mscoco.zip
    a_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Annotations_Val_mscoco.zip
    pairs_train: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Complementary_Pairs_Train_mscoco.zip
    pairs_val: https://s3.amazonaws.com/cvmlp/vqa/mscoco/vqa/v2_Complementary_Pairs_Val_mscoco.zip
  caption_train_images: 6000
  captions_per_train_image: 3
  caption_dev_images: 96
  extra_grounding_train_images: 2000   # grounding pools use caption images + these extra train2014 images
  presence_pool_max: 20000
  counting_pool_max: 10000
  grounding_dev: {presence: 12, counting: 12}     # 24 pairs / 48 questions
  grounding_test: {presence: 32, counting: 32}    # 64 pairs / 128 questions
  vqa_train: {"yes/no": 640, number: 256, other: 640}
  vqa_dev: {"yes/no": 12, number: 8, other: 12}
  vqa_test: {"yes/no": 36, number: 24, other: 36}
  vqa_min_agreement: 8
  min_object_area_frac: 0.0     # optional label-quality filter for grounding (0 = off, as in the manual)
  download_workers: 32

prompts:
  caption: "Describe the image briefly."
  short_answer_suffix: "Answer the question using a single word or phrase."

caps: {question: 80, caption_target: 64, answer_target: 16}

train:
  microbatch: 8
  grad_accum: 2                 # effective batch 16
  weight_decay: 0.01
  clip_norm: 1.0
  warmup_frac: 0.05
  final_lr_frac: 0.10
  ckpt_every: 250
  reset_optimizer_each_stage: true
  stages:
    - {name: caption_alignment, updates: 2250, connector_lr: 1.0e-3, lora_lr: null,
       mixture: {caption: 1.0}}
    - {name: visual_instruction, updates: 1500, connector_lr: 1.0e-4, lora_lr: 2.0e-5,
       mixture: {presence: 0.50, counting: 0.25, caption: 0.25}}
    - {name: natural_vqa, updates: 750, connector_lr: 5.0e-5, lora_lr: 1.0e-5,
       mixture: {vqa: 0.70, presence: 0.10, counting: 0.10, caption: 0.10}}
  lora: {r: 16, alpha: 32, dropout: 0.05, targets: [q_proj, k_proj, v_proj, o_proj]}
  calibration_images: 512

dev_eval_updates: [0, 500, 1000, 1500, 2000, 2250, 2500, 3000, 3500, 3750, 4000, 4500]

final_eval:
  max_new_tokens: 16
  batch_size: 8
  bootstrap: 4000
